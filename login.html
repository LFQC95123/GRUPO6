<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mundo Andino Travel</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <nav>
        <h1>🌿 Mundo Andino Travel</h1>
        <button class="hamburguesa" id="hamburguesa" onclick="toggleMenu()">☰</button>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="actividades.html">Actividades</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="carrito.html">🛒 Carrito <span class="carrito-badge" id="nav-badge">0</span></a></li>
            <li><a class="activo" href="login.html">Login</a></li>
        </ul>
    </nav>

</header>

<section class="login-page">

    <div class="login-container">

        <!-- LOGIN -->

        <div class="form-box">

            <h2>Iniciar Sesión</h2>

            <form>

                <input type="text" placeholder="Correo o Número Telefónico" required>

                <input type="password" placeholder="Contraseña" required>

                <button type="submit">
                    Ingresar
                </button>

            </form>

        </div>

        <!-- REGISTRO -->

        <div class="form-box">

            <h2>Registrarse</h2>

            <form>

                <input type="text" placeholder="Nombres y Apellidos" required>

                <input type="text" placeholder="Correo o Número Telefónico" required>

                <input type="password" placeholder="Crear Contraseña" required>

                <input type="password" placeholder="Confirmar Contraseña" required>

                <button type="submit">
                    Crear Cuenta
                </button>

            </form>

        </div>

    </div>

</section>

<footer>

    <p>© 2026 Mundo Andino Travel</p>

</footer>

<script>
function toggleMenu() {
    const menu = document.querySelector('nav ul');
    const btn = document.getElementById('hamburguesa');
    menu.classList.toggle('abierto');
    btn.textContent = menu.classList.contains('abierto') ? '✕' : '☰';
}
// Cerrar menu al hacer click en un link
document.querySelectorAll('nav ul a').forEach(a => {
    a.addEventListener('click', () => {
        document.querySelector('nav ul').classList.remove('abierto');
        document.getElementById('hamburguesa').textContent = '☰';
    });
});

function agregarAlCarrito() {
    if (!destinoSeleccionado || !paqueteSeleccionado) return;
    const total = destinoSeleccionado.precio + paqueteSeleccionado.precio;
    let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
    carrito.push({
        destino: destinoSeleccionado.nombre,
        imagen: destinoSeleccionado.imagen,
        precioDestino: destinoSeleccionado.precio,
        paquete: paqueteSeleccionado.personas,
        precioPaquete: paqueteSeleccionado.precio,
        total: total
    });
    localStorage.setItem('carrito', JSON.stringify(carrito));
    actualizarBadge();

    // Animación de confirmación
    const btn = document.getElementById('btn-agregar');
    btn.textContent = '✅ ¡Agregado!';
    btn.style.background = 'linear-gradient(135deg, #388e3c, #1b5e20)';
    setTimeout(() => {
        btn.innerHTML = '🛒 Agregar al Carrito';
        btn.style.background = '';
    }, 2000);
}

function actualizarBadge() {
    const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
    const badge = document.getElementById('nav-badge');
    if (badge) badge.textContent = carrito.length;
}

actualizarBadge();
</script>
<script src="contador.js"></script>

</body>
</html>
