<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mundo Andino Travel</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <nav>
        <h1>🌿 Mundo Andino Travel</h1>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="actividades.html">Actividades</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a class="activo" href="login.html">Login</a></li>
        </ul>
    </nav>

</header>

<section class="login-page">

    <div class="login-container">

        <!-- LOGIN -->

        <div class="form-box">

            <h2>Iniciar Sesión</h2>

            <form>

                <input type="text" placeholder="Correo o Número Telefónico" required>

                <input type="password" placeholder="Contraseña" required>

                <button type="submit">
                    Ingresar
                </button>

            </form>

        </div>

        <!-- REGISTRO -->

        <div class="form-box">

            <h2>Registrarse</h2>

            <form>

                <input type="text" placeholder="Nombres y Apellidos" required>

                <input type="text" placeholder="Correo o Número Telefónico" required>

                <input type="password" placeholder="Crear Contraseña" required>

                <input type="password" placeholder="Confirmar Contraseña" required>

                <button type="submit">
                    Crear Cuenta
                </button>

            </form>

        </div>

    </div>

</section>

<footer>

    <p>© 2026 Mundo Andino Travel</p>

</footer>

</body>
</html>
